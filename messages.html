
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Postcard | VOLGAN</title>

    <link rel="stylesheet" href="messages.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100dvh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #chatListSection {
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        #chatWindow[hidden] {
            display: none !important;
        }

        #chatWindow:not([hidden]) {
            display: flex !important;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .conversation-header {
            flex-shrink: 0;
        }

        #messageList {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        #messageForm {
            display: flex !important;
            flex-shrink: 0;
            width: 100%;
            gap: 8px;
            padding: 12px;
            box-sizing: border-box;
            background: white;
            border-top: 1px solid #ddd;
            position: relative;
            z-index: 20;
        }

        #messageInput {
            display: block !important;
            flex: 1;
            min-width: 0;
            height: 45px;
            box-sizing: border-box;
        }

        #messageForm button {
            display: block !important;
            flex-shrink: 0;
            height: 45px;
        }

        .bottom-nav {
            flex-shrink: 0;
        }
    </style>
</head>

<body>

<header class="chat-header">
    <a href="index.html" class="logo">VOLGAN</a>
    <h2>💌 Postcard</h2>
</header>

<main class="chat-container">

    <section id="chatListSection">

        <div class="chat-search">
            <input
                type="search"
                id="chatSearch"
                placeholder="Search Mates..."
                autocomplete="off"
            >
        </div>

        <div id="chatList"></div>

    </section>

    <section id="chatWindow" hidden>

        <div class="conversation-header">

            <button id="backButton" type="button">←</button>

            <div>
                <h3 id="chatUsername">User</h3>
                <small id="chatStatus">Mate</small>
            </div>

        </div>

        <div id="messageList" class="message-list"></div>

        <form id="messageForm">

            <input
                type="text"
                id="messageInput"
                placeholder="Write a Postcard..."
                autocomplete="off"
                maxlength="2000"
                required
            >

            <button type="submit">Send</button>

        </form>

    </section>

</main>

<nav class="bottom-nav">

    <a href="index.html">⌂<span>Home</span></a>
    <a href="friends.html">♧<span>Mates</span></a>
    <a href="create-post.html">＋<span>Create</span></a>
    <a href="search.html">⌕<span>Search</span></a>
    <a href="profile.html">◉<span>Profile</span></a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="messages.js" defer></script>

</body>
</html>
