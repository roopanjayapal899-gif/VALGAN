
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOLGAN – Open Source Social Network</title>

    <meta name="description"
        content="VOLGAN is an open source social network where people connect, share moments, discover communities and communicate freely.">

    <meta name="keywords"
        content="VOLGAN, Open Source Social Network, Open Source Social Media, Social Networking Platform, Connect with Friends, Share Moments">

    <meta name="author" content="VOLGAN">

    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#ffffff">

    <link rel="canonical"
        href="https://roopanjayapal899-gif.github.io/VALGAN/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title"
        content="VOLGAN – Open Source Social Network">
    <meta property="og:description"
        content="Connect Freely. Share Openly. Discover VOLGAN, an open source social network.">
    <meta property="og:url"
        content="https://roopanjayapal899-gif.github.io/VALGAN/">
    <meta property="og:site_name" content="VOLGAN">
    <meta property="og:image"
    content="https://roopanjayapal899-gif.github.io/VALGAN/og-image.jpg">

<meta name="twitter:image"
    content="https://roopanjayapal899-gif.github.io/VALGAN/og-image.jpg">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title"
        content="VOLGAN – Open Source Social Network">
    <meta name="twitter:description"
        content="Connect Freely. Share Openly. Discover VOLGAN.">

    <link rel="stylesheet" href="index.css">
        </head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="index.html" class="logo">VOLGAN</a>
        <button
    id="notificationButton"
    class="notification-button"
    type="button"
    aria-label="Notifications">

    🔔
    <span id="notificationCount" class="notification-count" hidden>
        0
    </span>

        </button>

        <a href="search.html"
           class="header-search"
           aria-label="Search">
            🔍
        </a>

    </header>

<!-- NOTIFICATION PANEL -->
<section id="notificationPanel" class="notification-panel" hidden>

    <div class="notification-header">
        <h3>Notifications</h3>

        <button id="closeNotifications" type="button">
            ✕
        </button>
    </div>

    <div id="notificationList">

        <p class="notification-empty">
            No notifications yet.
        </p>

    </div>

</section>
    

    <!-- MAIN CONTENT -->
    <main class="main-container">

        <!-- CREATE MOMENT -->
        <section class="create-post-card">

            <div class="create-post-top">

                <div class="avatar" id="userAvatar">
                    👤
                </div>

                <button
                    id="createPostButton"
                    class="post-prompt"
                    type="button">

                    What's happening in your world?

                </button>

            </div>

            <div class="create-post-actions">

                <button
                    id="textPostButton"
                    type="button">

                    ＋ Create a Moment

                </button>

            </div>

        </section>


        <!-- WORLD FEED -->
        <section class="feed-section">

            <div class="feed-heading">

                <h2>World 🌎</h2>

                <select
                    id="feedFilter"
                    aria-label="Feed filter">

                    <option value="all">
                        All Moments
                    </option>

                    <option value="latest">
                        Latest Moments
                    </option>

                </select>

            </div>


            <!-- MOMENTS WILL LOAD HERE -->
            <div id="feedContainer">

                <div class="empty-feed">

                    <div class="empty-icon">
                        🌊
                    </div>

                    <h3>
                        Your VOLGAN journey starts here!
                    </h3>

                    <p>
                        Moments from your community will appear here.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation">

        <a href="index.html" class="active">

            <span>⌂</span>
            <small>World</small>

        </a>


        <a href="friends.html">

            <span>♧</span>
            <small>Mates</small>

        </a>


        <a href="create-post.html" class="create-button">

            <span>＋</span>
            <small>Create</small>

        </a>


        <a href="messages.html">

            <span>✉</span>
            <small>Postcard</small>

        </a>


        <a href="profile.html">

            <span>○</span>
            <small>Profile</small>

        </a>

    </nav>


    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="index.js" defer></script>

</body>
</html>
